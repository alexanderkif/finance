[project]
name = "finance-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.162.0",
    "httpx[http2]==0.28.1",
    "python-dotenv==1.2.4",
    "tzdata==2026.6",
]

[dependency-groups]
dev = [
    "mcp>=2,<3",
    "pyright>=1.1",
    "ruff>=0.17",
]

[tool.pyright]
include = ["agent", "core", "routers", "tests", "index.py", "settings.py", "mcp_dev.py"]
exclude = [".venv", ".vercel", "build", "**/__pycache__"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "basic"
